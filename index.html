<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaraGalaxy - Mystery Life Edition</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; touch-action: none; }
        body{ overflow:hidden; background:black; font-family:'Courier New', Courier, monospace; }
        canvas{ display:block; image-rendering:pixelated; }
        
        #menu, #gameOver{ 
            position:absolute; inset:0; display:flex; flex-direction:column; 
            align-items:center; justify-content:center; gap:20px; 
            background:radial-gradient(circle,#002b36,#000); z-index:20; color: white; 
        }
        
        #title{ font-size:70px; color:#ffcc00; text-shadow: 0 0 15px #ffcc00; animation:pulse 1s infinite; font-weight: bold; }
        @keyframes pulse{ 0%, 100%{transform:scale(1);} 50%{transform:scale(1.05);} }
        
        button{ padding:15px 40px; background:#ffcc00; color: #000; border:none; font-weight:bold; cursor:pointer; font-size:20px; box-shadow: 0 0 20px #ffcc00; }
        
        #ui{ position:absolute; top:10px; left:10px; color:white; z-index:10; font-size:18px; background: rgba(0,20,30,0.8); padding: 10px; border: 1px solid #ffcc00; line-height: 1.4; min-width: 180px; pointer-events: none; }
        #ranking{ position:absolute; top:10px; right:10px; color:white; background:rgba(0,0,0,0.8); padding:15px; border:2px solid #ffcc00; z-index:10; width:200px; pointer-events: none; }
        
        /* Estilos del Joystick Mejorado */
        #joystick{ 
            position:absolute; bottom:50px; left:50px; width:100px; height:100px; 
            border:3px solid rgba(255, 204, 0, 0.5); border-radius:50%; display:none; 
            background: rgba(255, 255, 255, 0.1); z-index: 30;
        }
        #stick{ 
            position:absolute; width:40px; height:40px; background:#ffcc00; 
            border-radius:50%; left:30px; top:30px; 
            box-shadow: 0 0 15px #ffcc00; pointer-events: none;
            transition: none; /* Importante para respuesta instantánea */
        }

        .active-power { color: #00ffff; font-weight: bold; text-shadow: 0 0 5px #0ff; }
        .active-debuff { color: #ff00ff; font-weight: bold; text-shadow: 0 0 5px #f0f; }
    </style>
</head>
<body>

<div id="menu">
    <div id="title">SaraGalaxy</div>
    <p style="color: #ffffaa; font-size: 14px; margin-top: -15px;">Mystery Box: Fortune or Fate</p>
    <input id="playerName" type="text" placeholder="Piloto" style="padding:10px; text-align:center; border: 1px solid #ffcc00; background: #000; color: #ffcc00;">
    <button onclick="startGame()">INICIAR OPERACIÓN</button>
</div>

<div id="ui">
    💙 VIDA: <span id="lives">3</span><br>
    ⭐ PUNTAJE: <span id="score">0</span><br>
    🌍 LEVEL: <span id="level">1</span><br>
    🔫 BALA: <span id="bulletDisplay">NORMAL</span><br>
    ⏳ EFECTO: <span id="powerTimer">0s</span>
</div>

<div id="ranking"><h3>🏆 TOP</h3><ol id="rankingList" style="padding-left:20px; font-size: 12px;"></ol></div>

<div id="gameOver" style="display:none">
    <h1 style="color: #ffcc00;">SISTEMA CAÍDO</h1>
    <button onclick="location.reload()">REINTENTAR SUERTE</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let musicInterval;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

function playSound(freq, duration, type="square", vol=0.1) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = type;
    osc.start();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
}

function startSegaMusic() {
    let step = 0;
    const tempo = 135;
    const stepTime = 60 / tempo / 2;
    musicInterval = setInterval(() => {
        const notes = [55, 55, 110, 55, 82, 55, 98, 73]; 
        playSound(notes[step % notes.length], 0.2, "sawtooth", 0.1);
        step++;
    }, stepTime * 1000);
}

let started = false, score = 0, level = 1, lives = 3;
let powerTimeLeft = 0, debuffTimeLeft = 0;
let lastEffect = "NINGUNO";

const stars = [], bullets = [], enemies = [], particles = [], enemyBullets = [], items = [];
const player = { x: canvas.width/2, y: canvas.height-100, baseSpeed: 8 };
const boss = { x: 0, y: -200, size: 130, hp: 0, active: false, dir: 1, lastShot: 0 };
const keys = {};

// Joystick Vars
let dragging = false;
let joyX = 0;
let joyY = 0;

const phaseColors = ["#00ffff", "#0088ff", "#55ffff", "#00d4ff", "#ffffff", "#0055ff"];
for(let i=0; i<80; i++) stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, speed: 2 + Math.random()*5 });

function getLevelColor() { return phaseColors[Math.floor((level - 1) / 5) % phaseColors.length]; }

function startGame() {
    initAudio();
    startSegaMusic();
    document.getElementById("menu").style.display = "none";
    if(window.innerWidth < 900) document.getElementById("joystick").style.display = "block";
    started = true;
    spawnLoop();
    itemSpawnLoop();
    timerLoop();
}

function timerLoop() {
    if(!started) return;
    if(powerTimeLeft > 0) powerTimeLeft--;
    if(debuffTimeLeft > 0) debuffTimeLeft--;
    updateUI();
    setTimeout(timerLoop, 1000);
}

function spawnLoop() {
    if(!started) return;
    if(!boss.active) {
        enemies.push({ 
            x: Math.random()*canvas.width, y: -50, 
            w: 20 + Math.random()*40, h: 20 + Math.random()*40, 
            speed: 3 + (level * 1.2), lastShot: 0 
        });
    }
    setTimeout(spawnLoop, Math.max(150, 800 - level * 40));
}

function itemSpawnLoop() {
    if(!started) return;
    items.push({ x: Math.random() * (canvas.width - 40) + 20, y: -50, speed: 3 });
    setTimeout(itemSpawnLoop, 7000 + Math.random() * 5000);
}

function update() {
    if(!started) return;

    let pSpeed = player.baseSpeed + (level * 0.3);

    // Movimiento Teclado
    if(keys["ArrowLeft"] || keys["a"]) player.x -= pSpeed;
    if(keys["ArrowRight"] || keys["d"]) player.x += pSpeed;
    if(keys["ArrowUp"] || keys["w"]) player.y -= pSpeed;
    if(keys["ArrowDown"] || keys["s"]) player.y += pSpeed;

    // Movimiento Joystick
    if (dragging) {
        player.x += joyX * (pSpeed * 1.2);
        player.y += joyY * (pSpeed * 1.2);
        
        if(Date.now() % 7 === 0) {
            let curW = powerTimeLeft > 0 ? 35 : (debuffTimeLeft > 0 ? 1 : 5);
            bullets.push({x:player.x, y:player.y-20, w: curW});
            playSound(800, 0.03, "square", 0.04);
        }
    }

    player.x = Math.max(20, Math.min(canvas.width-20, player.x));
    player.y = Math.max(20, Math.min(canvas.height-20, player.y));

    // Balas y Colisiones
    bullets.forEach((b, i) => { b.y -= 20; if(b.y < 0) bullets.splice(i, 1); });

    items.forEach((it, i) => {
        it.y += it.speed;
        if(it.y > canvas.height) items.splice(i, 1);
        if(Math.hypot(it.x - player.x, it.y - player.y) < 35) {
            const chance = Math.random();
            if(chance < 0.40) { 
                powerTimeLeft = 10; debuffTimeLeft = 0; lastEffect = "¡MEGA BALA!"; playSound(1200, 0.3, "sine", 0.2);
            } else if (chance < 0.65) { 
                debuffTimeLeft = 8; powerTimeLeft = 0; lastEffect = "¡VIRUS!"; playSound(300, 0.5, "sawtooth", 0.2);
            } else if (chance < 0.85) { 
                damage(); lastEffect = "¡TRAMPA!"; explode(it.x, it.y, "#ff0000");
            } else { 
                lives++; lastEffect = "¡VIDA +1!"; playSound(880, 0.5, "sine", 0.3);
            }
            items.splice(i, 1);
            updateUI();
        }
    });

    let currentColor = getLevelColor();

    enemies.forEach((e, i) => {
        e.y += e.speed;
        if(Date.now() - e.lastShot > 2500 - level*50) {
            enemyBullets.push({ x: e.x, y: e.y + 20, speed: e.speed + 2 });
            e.lastShot = Date.now();
        }
        if(e.y > canvas.height) enemies.splice(i, 1);
        if(Math.abs(e.x - player.x) < e.w/2 + 10 && Math.abs(e.y - player.y) < e.h/2 + 10) { enemies.splice(i, 1); damage(); }

        bullets.forEach((b, bi) => {
            if(b.x > e.x - e.w/2 - b.w/2 && b.x < e.x + e.w/2 + b.w/2 && b.y > e.y - e.h/2 && b.y < e.y + e.h/2) {
                explode(e.x, e.y, currentColor);
                enemies.splice(i, 1); bullets.splice(bi, 1);
                score += 10; updateUI();
            }
        });
    });

    // Boss Logic
    if(score > 0 && score % 1000 === 0 && !boss.active) {
        boss.active = true; boss.hp = 100 + level*50; boss.x = canvas.width/2; boss.y = -100;
    }
    if(boss.active) {
        if(boss.y < 120) boss.y += 2;
        boss.x += boss.dir * (4 + level);
        if(boss.x > canvas.width - 60 || boss.x < 60) boss.dir *= -1;
        if(Date.now() - boss.lastShot > 600) { enemyBullets.push({ x: boss.x, y: boss.y + 50, speed: 6 }); boss.lastShot = Date.now(); }
        bullets.forEach((b, bi) => {
            if(Math.hypot(boss.x - b.x, boss.y - b.y) < 70) {
                boss.hp--; bullets.splice(bi, 1);
                if(boss.hp <= 0) { boss.active = false; score += 1000; level++; updateUI(); explode(boss.x, boss.y, "#fff"); }
            }
        });
    }

    enemyBullets.forEach((eb, i) => {
        eb.y += eb.speed;
        if(eb.y > canvas.height) enemyBullets.splice(i, 1);
        if(Math.hypot(eb.x - player.x, eb.y - player.y) < 15) { enemyBullets.splice(i, 1); damage(); }
    });

    particles.forEach((p, i) => { p.x += p.dx; p.y += p.dy; p.life--; if(p.life <= 0) particles.splice(i, 1); });
}

function damage() {
    lives--; playSound(100, 0.5, "sawtooth", 0.3);
    updateUI();
    if(lives <= 0) {
        started = false; clearInterval(musicInterval);
        document.getElementById("gameOver").style.display = "flex";
        saveRanking();
    }
}

function updateUI() {
    document.getElementById("lives").innerText = lives;
    document.getElementById("score").innerText = score;
    document.getElementById("level").innerText = level;
    let bDisp = document.getElementById("bulletDisplay");
    let tDisp = document.getElementById("powerTimer");
    
    if(powerTimeLeft > 0) {
        bDisp.innerText = "MEGA"; bDisp.className = "active-power";
        tDisp.innerText = powerTimeLeft + "s";
    } else if(debuffTimeLeft > 0) {
        bDisp.innerText = "MINI"; bDisp.className = "active-debuff";
        tDisp.innerText = debuffTimeLeft + "s";
    } else {
        bDisp.innerText = "NORMAL"; bDisp.className = "";
        tDisp.innerText = lastEffect;
    }
}

function explode(x, y, color) {
    for(let i=0; i<15; i++) particles.push({ x, y, dx: (Math.random()-0.5)*10, dy: (Math.random()-0.5)*10, life: 25, color });
}

function draw() {
    ctx.fillStyle = "black"; ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = "white"; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
    if(!started) return;

    items.forEach(it => {
        ctx.fillStyle = (Date.now() % 200 < 100) ? "#ffcc00" : "#ffffff"; 
        ctx.shadowBlur = 15; ctx.shadowColor = "#ffcc00";
        ctx.fillRect(it.x - 15, it.y - 15, 30, 30);
        ctx.fillStyle = "black"; ctx.font = "bold 20px Arial"; ctx.fillText("?", it.x-6, it.y+8);
        ctx.shadowBlur = 0;
    });

    ctx.fillStyle = "#fff"; ctx.shadowBlur = 15; ctx.shadowColor = "#00ffff";
    ctx.beginPath(); ctx.moveTo(player.x, player.y-20); ctx.lineTo(player.x-18, player.y+18); ctx.lineTo(player.x+18, player.y+18); ctx.fill();
    ctx.shadowBlur = 0;

    bullets.forEach(b => {
        ctx.fillStyle = (debuffTimeLeft > 0) ? "#f0f" : "#0ff";
        ctx.fillRect(b.x - b.w/2, b.y, b.w, 15);
    });

    let currentColor = getLevelColor();
    enemies.forEach(e => { ctx.fillStyle = currentColor; ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h); });

    if(boss.active) { ctx.fillStyle = currentColor; ctx.fillRect(boss.x-65, boss.y-65, 130, 130); }

    ctx.fillStyle = "#fff"; enemyBullets.forEach(eb => { ctx.beginPath(); ctx.arc(eb.x, eb.y, 6, 0, Math.PI*2); ctx.fill(); });
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
}

function saveRanking() {
    let r = JSON.parse(localStorage.getItem("ranking") || "[]");
    r.push({ n: document.getElementById("playerName").value || "Piloto", s: score });
    r.sort((a,b)=>b.s-a.s);
    localStorage.setItem("ranking", JSON.stringify(r.slice(0,5)));
}

function loadRanking() {
    let r = JSON.parse(localStorage.getItem("ranking") || "[]");
    document.getElementById("rankingList").innerHTML = r.map(x => `<li>${x.n}: ${x.s}</li>`).join("");
}

// Eventos de Teclado
window.addEventListener("keydown", e => { 
    keys[e.key] = true; 
    if(e.key === " " && started) { 
        let curW = powerTimeLeft > 0 ? 30 : (debuffTimeLeft > 0 ? 1 : 4);
        bullets.push({x:player.x, y:player.y-20, w: curW}); 
        playSound(800, 0.05, "square", 0.05); 
    } 
});
window.addEventListener("keyup", e => keys[e.key] = false);

// --- LÓGICA DE JOYSTICK OPTIMIZADA ---
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const handleJoystick = (touch) => {
    const rect = joystick.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const maxDist = rect.width / 2;

    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    const dist = Math.hypot(dx, dy);

    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }

    joyX = dx / maxDist;
    joyY = dy / maxDist;
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
};

joystick.addEventListener("touchstart", (e) => {
    dragging = true;
    handleJoystick(e.touches[0]);
    e.preventDefault();
}, {passive: false});

window.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    handleJoystick(e.touches[0]);
    e.preventDefault();
}, {passive: false});

window.addEventListener("touchend", () => {
    dragging = false;
    joyX = 0; joyY = 0;
    stick.style.transform = `translate(0, 0)`;
});

loadRanking();
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
