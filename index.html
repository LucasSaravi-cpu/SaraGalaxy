<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaraGalaxy</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, Helvetica, sans-serif;
}

canvas{
    display:block;
    image-rendering:pixelated;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    background:radial-gradient(circle,#09111f,#02040a,#000);
    z-index:20;
}

#title{
    font-size:80px;
    color:#00ffff;
    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

button,input{
    padding:14px;
    width:280px;
    border:none;
    border-radius:14px;
    font-size:20px;
}

button{
    background:#00ffff;
    font-weight:bold;
    cursor:pointer;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    z-index:10;
    font-size:20px;
}

#ranking{
    position:absolute;
    top:10px;
    right:10px;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border:2px solid #00ffff;
    border-radius:10px;
    z-index:10;
    width:220px;
}

#gameOver{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.8);
    color:white;
    z-index:30;
    gap:20px;
}

#joystick{
    position:absolute;
    bottom:40px;
    left:40px;
    width:120px;
    height:120px;
    border:3px solid rgba(255,255,255,0.4);
    border-radius:50%;
    display:none;
    z-index:50;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    background:#00ffff;
    border-radius:50%;
    left:35px;
    top:35px;
}
</style>
</head>
<body>

<div id="menu">
    <div id="title">SaraGalaxy</div>
    <input id="playerName" placeholder="Nombre jugador">
    <button onclick="startGame()">JUGAR</button>
</div>

<div id="ui">
    ❤️ Vidas: <span id="lives">3</span><br>
    ⭐ Puntaje: <span id="score">0</span><br>
    🌍 Nivel: <span id="level">1</span>
</div>

<div id="ranking">
<h3>🏆 Ranking</h3>
<ol id="rankingList"></ol>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <h2 id="finalText"></h2>
    <button onclick="location.reload()">REINICIAR</button>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function beep(freq,duration){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = freq;
    osc.type = "square";

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.00001,
        audioCtx.currentTime + duration
    );

    osc.stop(audioCtx.currentTime + duration);
}

let started = false;
let score = 0;
let level = 1;
let lives = 3;
let bossActive = false;

let playerName = "Lucas";

const stars = [];
const bullets = [];
const enemies = [];
const particles = [];

const player = {
    x:canvas.width/2,
    y:canvas.height-100,
    size:20,
    speed:6,
    color:"#00ffff"
};

const boss = {
    x:canvas.width/2,
    y:120,
    size:90,
    hp:30,
    active:false
};

const keys = {};

for(let i=0;i<250;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        s:Math.random()*3,
        speed:1+Math.random()*3
    });
}

function startGame(){

    playerName =
        document.getElementById("playerName").value || "Lucas";

    document.getElementById("menu").style.display = "none";

    if(innerWidth < 900){
        document.getElementById("joystick").style.display = "block";
    }

    started = true;
}

document.addEventListener("keydown",e=>{

    keys[e.key] = true;

    if(e.key === " " && started){

        bullets.push({
            x:player.x,
            y:player.y
        });

        beep(600,0.1);
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key] = false;
});

function spawnEnemy(){

    if(boss.active) return;

    enemies.push({
        x:Math.random()*canvas.width,
        y:-40,
        size:15 + Math.random()*20,
        speed:2 + level
    });
}

setInterval(()=>{
    if(started){
        spawnEnemy();
    }
},700);

function createExplosion(x,y){

    beep(120,0.2);

    for(let i=0;i<25;i++){

        particles.push({
            x:x,
            y:y,
            dx:(Math.random()-0.5)*8,
            dy:(Math.random()-0.5)*8,
            size:2+Math.random()*5,
            life:40
        });
    }
}

function drawGalaxy(){

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    stars.forEach(s=>{

        ctx.fillStyle = "white";
        ctx.fillRect(s.x,s.y,s.s,s.s);

        s.y += s.speed;

        if(s.y > canvas.height){
            s.y = 0;
            s.x = Math.random()*canvas.width;
        }
    });
}

function updatePlayer(){

    if(keys["a"] || keys["ArrowLeft"]){
        player.x -= player.speed;
    }

    if(keys["d"] || keys["ArrowRight"]){
        player.x += player.speed;
    }

    if(keys["w"] || keys["ArrowUp"]){
        player.y -= player.speed;
    }

    if(keys["s"] || keys["ArrowDown"]){
        player.y += player.speed;
    }

    player.x = Math.max(0,Math.min(canvas.width,player.x));
    player.y = Math.max(0,Math.min(canvas.height,player.y));
}

function drawPlayer(){

    ctx.fillStyle = player.color;

    ctx.beginPath();
    ctx.moveTo(player.x,player.y-25);
    ctx.lineTo(player.x-20,player.y+20);
    ctx.lineTo(player.x+20,player.y+20);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ffff";
}

function drawBullets(){

    bullets.forEach((b,i)=>{

        b.y -= 10;

        ctx.fillStyle = "yellow";
        ctx.fillRect(b.x,b.y,4,12);

        if(b.y < 0){
            bullets.splice(i,1);
        }
    });
}

function drawEnemies(){

    enemies.forEach((e,ei)=>{

        e.y += e.speed;

        ctx.fillStyle = "red";
        ctx.fillRect(
            e.x-e.size/2,
            e.y-e.size/2,
            e.size,
            e.size
        );

        let dx = e.x-player.x;
        let dy = e.y-player.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < e.size + player.size){

            createExplosion(player.x,player.y);

            enemies.splice(ei,1);

            lives--;

            document.getElementById("lives").innerText = lives;

            if(lives <= 0){
                finishGame();
            }
        }

        bullets.forEach((b,bi)=>{

            let dx2 = e.x-b.x;
            let dy2 = e.y-b.y;
            let dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);

            if(dist2 < e.size){

                createExplosion(e.x,e.y);

                enemies.splice(ei,1);
                bullets.splice(bi,1);

                score += 10;

                document.getElementById("score").innerText = score;

                if(score % 100 === 0){
                    level++;

                    document.getElementById("level").innerText = level;

                    beep(900,0.3);
                }

                if(score >= 300 && !boss.active){
                    activateBoss();
                }
            }
        });
    });
}

function activateBoss(){

    boss.active = true;
    boss.hp = 30;
}

function drawBoss(){

    if(!boss.active) return;

    ctx.fillStyle = "purple";

    ctx.fillRect(
        boss.x-boss.size/2,
        boss.y-boss.size/2,
        boss.size,
        boss.size
    );

    ctx.fillStyle = "white";
    ctx.fillText("BOSS HP: " + boss.hp, boss.x-40, boss.y-70);

    bullets.forEach((b,bi)=>{

        let dx = boss.x-b.x;
        let dy = boss.y-b.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < boss.size){

            bullets.splice(bi,1);

            boss.hp--;

            createExplosion(boss.x,boss.y);

            if(boss.hp <= 0){

                boss.active = false;

                score += 500;

                document.getElementById("score").innerText = score;

                createExplosion(boss.x,boss.y);

                beep(1200,0.5);
            }
        }
    });
}

function drawParticles(){

    particles.forEach((p,i)=>{

        p.x += p.dx;
        p.y += p.dy;

        p.life--;

        ctx.fillStyle = "orange";

        ctx.fillRect(p.x,p.y,p.size,p.size);

        if(p.life <= 0){
            particles.splice(i,1);
        }
    });
}

function saveRanking(){

    let ranking = JSON.parse(
        localStorage.getItem("ranking") || "[]"
    );

    ranking.push({
        name:playerName,
        score:score
    });

    ranking.sort((a,b)=>b.score-a.score);

    ranking = ranking.slice(0,5);

    localStorage.setItem(
        "ranking",
        JSON.stringify(ranking)
    );

    loadRanking();
}

function loadRanking(){

    let ranking = JSON.parse(
        localStorage.getItem("ranking") || "[]"
    );

    let html = "";

    ranking.forEach(r=>{
        html += `<li>${r.name} - ${r.score}</li>`;
    });

    document.getElementById("rankingList").innerHTML = html;
}

function finishGame(){

    started = false;

    saveRanking();

    document.getElementById("gameOver").style.display = "flex";

    document.getElementById("finalText").innerText =
        playerName + " hizo " + score + " puntos";
}

function loop(){

    drawGalaxy();

    if(started){

        updatePlayer();

        drawPlayer();

        drawBullets();

        drawEnemies();

        drawBoss();

        drawParticles();
    }

    requestAnimationFrame(loop);
}

loadRanking();
loop();

window.addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let dragging = false;

stick.addEventListener("touchstart",()=>{
    dragging = true;
});

window.addEventListener("touchend",()=>{
    dragging = false;

    stick.style.left = "35px";
    stick.style.top = "35px";
});

window.addEventListener("touchmove",(e)=>{

    if(!dragging) return;

    const touch = e.touches[0];

    const rect = joystick.getBoundingClientRect();

    let x = touch.clientX - rect.left - 25;
    let y = touch.clientY - rect.top - 25;

    x = Math.max(0,Math.min(70,x));
    y = Math.max(0,Math.min(70,y));

    stick.style.left = x + "px";
    stick.style.top = y + "px";

    player.x += (x-35)*0.1;
    player.y += (y-35)*0.1;
});
</script>

</body>
</html>
